<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#FAFAF7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<title>WurfKit – Danke!</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#FAFAF7;color:#1A1A1A;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(82,183,136,0.18) 0%,rgba(82,183,136,0.07) 30%,transparent 70%);pointer-events:none}
.card{position:relative;background:#FFFFFF;border:1px solid #E8E8E0;border-radius:24px;padding:3rem 2.5rem;max-width:480px;width:100%;box-shadow:0 12px 32px rgba(27,67,50,.08)}
.check{width:64px;height:64px;border-radius:50%;background:#D8F3DC;border:2px solid rgba(45,106,79,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:28px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:2rem;font-weight:500;margin-bottom:0.5rem;letter-spacing:-0.02em;color:#1B4332}
h1 em{color:#2D6A4F;font-style:italic}
p{color:#4A4A4A;font-size:0.95rem;line-height:1.7;margin-bottom:1.5rem}
a{display:inline-block;background:#2D6A4F;color:#fff;padding:0.7rem 1.5rem;border-radius:10px;font-weight:600;font-size:0.88rem;text-decoration:none;transition:all 0.2s}
a:hover{background:#1B4332;box-shadow:0 6px 18px rgba(45,106,79,0.28)}
.logo{font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;color:#1A1A1A;margin-bottom:2rem;letter-spacing:-0.02em}
.logo b{color:#2D6A4F;font-weight:600}
.de,.en,.ru{display:none}
body.l-de .de{display:inline}body.l-en .en{display:inline}body.l-ru .ru{display:inline}
</style>
</head>
<body>
<div class="logo"><b>Wurf</b>Kit</div>
<div class="card">
<div class="check">✓</div>
<h1><span class="de">Danke!</span><span class="en"><em>Thank you!</em></span><span class="ru">Спасибо!</span></h1>
<p>
<span class="de">Sie sind auf der Warteliste! Wir melden uns, sobald WurfKit bereit ist.</span>
<span class="en">You're on the waitlist! We'll reach out when WurfKit is ready.</span>
<span class="ru">Вы в списке ожидания! Мы свяжемся, когда WurfKit будет готов.</span>
</p>
<a href="index.html"><span class="de">← Zurück zur Seite</span><span class="en">← Back to site</span><span class="ru">← Назад на сайт</span></a>
</div>
<script>
var l='de';try{l=localStorage.getItem('wk-lang')||'de'}catch(e){}
document.body.className='l-'+l;
</script>
</body>
</html>
